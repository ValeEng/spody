# SpOdy input file -- Earth-Moon CR3BP equilibrium at L4.
#
# Smoke test for the Circular Restricted 3-Body Problem dynamics
# (synodic rotating frame, dimensional units). The satellite is
# placed at the L4 triangular libration point with zero synodic
# velocity. With the Earth-Moon mass ratio mu = M_Moon/(M_Earth+M_Moon)
# ~ 0.01215 well below the Routh stability limit (mu < 0.0385),
# L4 is linearly stable: a satellite at rest in the synodic frame
# stays at L4 indefinitely (any small perturbation gives bounded
# epicyclic motion around the point).
#
# Validation: |r(t) - r_L4| should stay near zero over the 30-day
# propagation (up to numerical noise from rel_tol and IC quantisation).
# All paths are relative to this TOML file.

[simulation]
name           = "cr3bp_em_l4"
dynamics_model = "cr3bp"
duration_s     = 2.592e+06            # 30 days

[cr3bp]
# Engine-resolved parameters of the pair below (CR3BP_PAIRS /
# BODY_TABLE in src/toml_input.c); informational, the run banner
# prints the same block.
#   L   = 384400 km        (primary separation)
#   mu1 = 398600.4415 km^3/s^2   (Earth)
#   mu2 = 4902.8005821478 km^3/s^2   (Moon)
#   mu  = mu2/(mu1+mu2)       = 0.0121505853505625
#   om  = sqrt((mu1+mu2)/L^3) = 2.66531440062302e-06 rad/s   (T = 27.2846 d)
primary_1 = "Earth"
primary_2 = "Moon"

[initial_state]
# L4 in the synodic frame: ((1/2 - mu) * L, (sqrt(3)/2) * L, 0) with
# L = 384400 km. The values below were computed with GMAT's mu =
# 0.012150585609 = 1/(1 + 81.30056), the DE405 Earth-Moon mass ratio;
# the mu the engine resolves from the GM values above is
# 0.0121505853505625. The two agree to 8 digits, so the choice of mu
# moves L4 by 10 cm -- irrelevant here.
#
# Exact L4 under either mu is (187529.315, 332900.165) km, so the
# state below sits 35 m off in x and 5 m off in y: that is the "IC
# quantisation" the header mentions, not a constants mismatch. The
# offset only adds a small bounded epicycle around the point.
frame        = "synodic_rotating"
position_km  = [187529.35, 332900.16, 0.0]
velocity_kms = [0.0, 0.0, 0.0]

[integrator]
type     = "rkdp45"
rel_tol  = 1.0e-12
h_init_s = 60.0
h_min_s  = 1.0e-5
h_max_s  = 3600.0

[output]
mode       = "fixed"
interval_s = 3600.0                   # hourly samples
output_dir = "output"
csv_file   = "output/cr3bp_em_l4_state.csv"
bin_file   = "output/cr3bp_em_l4_state.bin"
